[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "SharedWaypoints"
versionNumber = "1.0.4"
description = "Shared HUD + ship radar/map waypoints. Indoor/outdoor aware; F8 drop, F7 clear. Host syncs markers."
websiteUrl = "https://github.com/ben-hough/lc-shared-waypoints"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-SharedWaypoints"

[[build.copy]]
source = "SharedWaypoints.dll"
target = "SharedWaypoints.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "serverside", "tweaks-and-quality-of-life", "ai-generated"]
