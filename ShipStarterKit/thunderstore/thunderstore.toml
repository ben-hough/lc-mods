[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "ShipStarterKit"
versionNumber = "1.0.0"
description = "On first load of a save, pile configurable store equipment on the ship floor (belt bags, flashlights, jetpacks, and more)."
websiteUrl = "https://github.com/ben-hough/lc-ship-starter-kit"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-ShipStarterKit"

[[build.copy]]
source = "ShipStarterKit.dll"
target = "ShipStarterKit.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "tweaks-and-quality-of-life", "ai-generated"]
