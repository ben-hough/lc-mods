[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "ForceLguRefund"
versionNumber = "1.0.1"
description = "Force Late Game Upgrades refund UI on so you can sell back upgrade levels. Companion for malco Lategame_Upgrades."
websiteUrl = "https://github.com/ben-hough/lc-force-lgu-refund"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
malco-Lategame_Upgrades = "3.14.0"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-ForceLguRefund"

[[build.copy]]
source = "ForceLguRefund.dll"
target = "ForceLguRefund.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "serverside", "tweaks-and-quality-of-life", "ai-generated"]
