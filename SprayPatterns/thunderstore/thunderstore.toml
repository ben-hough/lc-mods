[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "SprayPatterns"
versionNumber = "0.1.0"
description = "Overwatch-style spray pattern stamps for the spray can: radial select, preview, rotate, synced stamps. Vanilla free-paint still available."
websiteUrl = "https://github.com/ben-hough/lc-spray-patterns"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-SprayPatterns"

[[build.copy]]
source = "SprayPatterns.dll"
target = "SprayPatterns.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "tweaks-and-quality-of-life", "misc", "clientside"]
