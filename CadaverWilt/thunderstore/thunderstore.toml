[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "CadaverWilt"
versionNumber = "1.0.2"
description = "When a Cadaver Growth patch is fully sprayed away, its bloom enemies wilt and die. Host recommended."
websiteUrl = "https://github.com/ben-hough/lc-cadaver-wilt"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-CadaverWilt"

[[build.copy]]
source = "CadaverWilt.dll"
target = "CadaverWilt.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "serverside", "tweaks-and-quality-of-life", "ai-generated"]
