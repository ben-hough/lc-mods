[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "EmotePlaylist"
versionNumber = "1.0.3"
description = "Loop TooManyEmotes quick-slot remotes on a shared cycle. Press E to sync into the playlist."
websiteUrl = "https://github.com/ben-hough/lc-emote-playlist"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
FlipMods-TooManyEmotes = "2.3.16"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-EmotePlaylist"

[[build.copy]]
source = "EmotePlaylist.dll"
target = "EmotePlaylist.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "emotes", "ai-generated"]
