[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "ShipDoorTerminal"
versionNumber = "1.0.11"
description = "Terminal commands door / opendoor / closedoor for the ship hangar doors. Host recommended."
websiteUrl = "https://github.com/ben-hough/lc-ship-door-terminal"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-ShipDoorTerminal"

[[build.copy]]
source = "ShipDoorTerminal.dll"
target = "ShipDoorTerminal.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "serverside", "tweaks-and-quality-of-life", "ai-generated"]
