[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "ShipBeacon"
versionNumber = "1.0.14"
description = "Outdoor HUD ship direction and distance in orange clock-style text. Pure client-side QoL."
websiteUrl = "https://github.com/ben-hough/lc-ship-beacon"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-ShipBeacon"

[[build.copy]]
source = "ShipBeacon.dll"
target = "ShipBeacon.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "clientside", "tweaks-and-quality-of-life", "ai-generated"]
