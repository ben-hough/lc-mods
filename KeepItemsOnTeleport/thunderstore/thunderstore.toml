[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "KeepItemsOnTeleport"
versionNumber = "1.0.1"
description = "Keep inventory items when beamed by the ship teleporter (normal and inverse). Host recommended."
websiteUrl = "https://github.com/ben-hough/lc-keep-items-on-teleport"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-KeepItemsOnTeleport"

[[build.copy]]
source = "KeepItemsOnTeleport.dll"
target = "KeepItemsOnTeleport.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "serverside", "tweaks-and-quality-of-life", "ai-generated"]
