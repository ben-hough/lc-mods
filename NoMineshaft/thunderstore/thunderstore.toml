[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "NoMineshaft"
versionNumber = "1.0.7"
description = "Removes Mineshaft interiors from dungeon rotation. Host must run this for moon generation."
websiteUrl = "https://github.com/ben-hough/lc-no-mineshaft"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-NoMineshaft"

[[build.copy]]
source = "NoMineshaft.dll"
target = "NoMineshaft.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "serverside", "tweaks-and-quality-of-life", "ai-generated"]
