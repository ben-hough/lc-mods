[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "MapClickCodes"
versionNumber = "1.0.11"
description = "Click code markers on the main ship radar to activate terminal codes (doors, turrets, mines, traps)."
websiteUrl = "https://github.com/ben-hough/lc-map-click-codes"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-MapClickCodes"

[[build.copy]]
source = "MapClickCodes.dll"
target = "MapClickCodes.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "tweaks-and-quality-of-life", "ai-generated"]
