[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "WeedKillerRefill"
versionNumber = "1.0.10"
description = "Refill an empty weed killer can with R (configurable). Syncs tank charge across the lobby."
websiteUrl = "https://github.com/ben-hough/lc-mods/tree/main/WeedKillerRefill"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-WeedKillerRefill"

[[build.copy]]
source = "WeedKillerRefill.dll"
target = "WeedKillerRefill.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "serverside", "tweaks-and-quality-of-life", "ai-generated"]
