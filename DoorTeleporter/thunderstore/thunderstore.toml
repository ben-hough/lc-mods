[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "DoorTeleporter"
versionNumber = "1.0.2"
description = "Terminal DOORPORT/DTP teleports you in front of a random main entrance or fire exit. Host recommended."
websiteUrl = "https://github.com/ben-hough/lc-door-teleporter"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-DoorTeleporter"

[[build.copy]]
source = "DoorTeleporter.dll"
target = "DoorTeleporter.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "serverside", "tweaks-and-quality-of-life", "ai-generated"]
