[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "UnbreakableSurfaces"
versionNumber = "1.0.2"
description = "Bridges and unstable platforms never collapse. Host should run it for synced surfaces."
websiteUrl = "https://github.com/ben-hough/lc-unbreakable-surfaces"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-UnbreakableSurfaces"

[[build.copy]]
source = "UnbreakableSurfaces.dll"
target = "UnbreakableSurfaces.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "serverside", "tweaks-and-quality-of-life", "ai-generated"]
