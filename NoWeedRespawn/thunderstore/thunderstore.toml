[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "NoWeedRespawn"
versionNumber = "1.0.1"
description = "Cleared weeds, mold, and cadaver plants stay gone for the rest of the moon. Host should run it."
websiteUrl = "https://github.com/ben-hough/lc-no-weed-respawn"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-NoWeedRespawn"

[[build.copy]]
source = "NoWeedRespawn.dll"
target = "NoWeedRespawn.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["mods", "serverside", "tweaks-and-quality-of-life", "ai-generated"]
